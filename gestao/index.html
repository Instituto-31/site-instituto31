<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Instituto 31 · Gestão</title>
<link rel="icon" href="https://instituto31.pt/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f5f4f1;--card:#fff;--ink:#1a1916;--ink2:#4a4844;--ink3:#888480;
  --gold:#b5913a;--gold-bg:#fdf6e7;--gold-b:rgba(181,145,58,.2);
  --teal:#2e7d8a;--teal-bg:#e8f4f6;
  --rose:#c0392b;--rose-bg:#fdf0ee;
  --sage:#3d6b4a;--sage-bg:#edf4ef;
  --border:rgba(26,25,22,.09);--border2:rgba(26,25,22,.05);
  --r:10px;--r2:7px;--sh:0 1px 3px rgba(26,25,22,.07),0 4px 14px rgba(26,25,22,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;}
.app{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sb{width:210px;background:var(--ink);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.logo-name{font-size:18px;font-weight:600;color:#fff;}
.logo-name em{color:var(--gold);font-style:normal;}
.logo-sub{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.yr-row{display:flex;align-items:center;gap:6px;margin-top:10px;}
.yr-btn{padding:2px 9px;border-radius:9px;font-size:10px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);transition:all .13s;}
.yr-btn.active{background:var(--gold);color:#fff;}
.yr-add{background:none;border:none;color:var(--gold);font-size:16px;cursor:pointer;padding:0 3px;margin-left:auto;}

nav{padding:8px 0;flex:1;}
.nav-sec{font-size:9px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.2);padding:10px 18px 5px;}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:rgba(255,255,255,.45);font-size:13px;border-left:2px solid transparent;transition:all .13s;}
.nav-i:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.04);}
.nav-i.on{color:#fff;background:rgba(181,145,58,.13);border-left-color:var(--gold);}
.nav-ico{font-size:14px;width:17px;text-align:center;flex-shrink:0;}
.nb{margin-left:auto;font-size:9px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px;text-align:center;}
.nb-r{background:var(--rose);color:#fff;}
.nb-g{background:var(--sage);color:#fff;}
.nb-b{background:var(--gold);color:#fff;}
.nb-o{background:#e89e3b;color:#fff;}

.sb-user{padding:12px 18px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:9px;}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--teal));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}
.sb-nm{font-size:12px;color:#fff;font-weight:500;line-height:1.2;}
.sb-rl{font-size:10px;color:rgba(255,255,255,.3);}

/* ── MAIN ── */
.main{margin-left:210px;flex:1;}
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50;}
.tb-title{font-size:16px;font-weight:600;color:var(--ink);flex:1;}
.tb-title em{color:var(--gold);font-style:normal;}
.content{padding:22px 24px;}

/* ── PAGES ── */
.page{display:none;animation:fadeIn .18s ease;}
.page.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── PAGE HEADER ── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.ph h1{font-size:21px;font-weight:600;}
.ph h1 em{color:var(--gold);font-style:normal;}
.ph p{font-size:12.5px;color:var(--ink3);margin-top:3px;}
.ph-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);}
.card-hd{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.card-hd small{font-size:11px;color:var(--ink3);font-weight:400;}

/* ── GRID ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* ── STAT ── */
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;}
.stat::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;}
.stat.gold::after{background:var(--gold);}
.stat.teal::after{background:var(--teal);}
.stat.sage::after{background:var(--sage);}
.stat.rose::after{background:var(--rose);}
.stat-v{font-size:26px;font-weight:600;color:var(--ink);line-height:1;}
.stat-l{font-size:11px;color:var(--ink3);margin-top:5px;}

/* ── ALERTS ── */
.alert{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:var(--r2);font-size:13px;margin-bottom:10px;line-height:1.5;}
.aw{background:var(--gold-bg);border:1px solid var(--gold-b);color:#7a6020;}
.ar{background:var(--rose-bg);border:1px solid rgba(192,57,43,.15);color:var(--rose);}
.at{background:var(--teal-bg);border:1px solid rgba(46,125,138,.15);color:var(--teal);}
.as{background:var(--sage-bg);border:1px solid rgba(61,107,74,.15);color:var(--sage);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r2);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .13s;white-space:nowrap;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{filter:brightness(1.08);box-shadow:0 3px 10px rgba(181,145,58,.3);}
.btn-out{background:transparent;border:1px solid var(--border);color:var(--ink2);}
.btn-out:hover{background:var(--bg);}
.btn-teal{background:var(--teal);color:#fff;}
.btn-sage{background:var(--sage);color:#fff;}
.btn-rose{background:var(--rose);color:#fff;}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px;}

/* ── TABLE ── */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--bg);color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border2);transition:background .1s;}
tbody tr:hover{background:#faf9f7;}
tbody td{padding:10px 14px;color:var(--ink2);vertical-align:middle;}
.tr-click{cursor:pointer;}

/* ── CHIPS ── */
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.cg{background:var(--sage-bg);color:var(--sage);}
.co{background:var(--gold-bg);color:var(--gold);}
.ct{background:var(--teal-bg);color:var(--teal);}
.cr{background:var(--rose-bg);color:var(--rose);}
.cn{background:var(--bg);color:var(--ink3);border:1px solid var(--border);}

/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:8px 11px;color:var(--ink);font-family:'Outfit',sans-serif;font-size:13.5px;outline:none;width:100%;transition:border-color .13s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(181,145,58,.08);}
.fg textarea{resize:vertical;min-height:65px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}
.full{grid-column:1/-1;}
.fg-ro input,.fg-ro select{background:var(--bg);color:var(--ink3);}

/* ── SECTION LABEL ── */
.slbl{font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border2);}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(26,25,22,.5);backdrop-filter:blur(5px);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;}
.mo.open{display:flex;}
.md{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:620px;max-height:93vh;overflow-y:auto;box-shadow:0 20px 60px rgba(26,25,22,.22);animation:slideUp .2s ease;}
.md-lg{max-width:800px;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.md-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;}
.md-hd h2{font-size:17px;font-weight:600;}
.md-hd p{font-size:12px;color:var(--ink3);margin-top:3px;}
.md-x{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:18px;line-height:1;padding:2px;}
.md-x:hover{color:var(--ink);}
.md-body{padding:18px 22px;}
.md-foot{padding:0 22px 18px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:14px;margin-top:6px;}

/* ── PERFIL ── */
.perfil-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);}
.perfil-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--teal));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;flex-shrink:0;}
.perfil-pid{font-family:monospace;font-size:11px;background:var(--bg);padding:2px 8px;border-radius:4px;color:var(--ink2);}
.perfil-nome{font-size:20px;font-weight:600;color:var(--ink);}
.perfil-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;}
.ptab{padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .13s;}
.ptab.on{color:var(--gold);border-bottom-color:var(--gold);}
.ptab-panel{display:none;}
.ptab-panel.on{display:block;}

/* ── INFO ROW ── */
.info-row{display:flex;gap:0;border-bottom:1px solid var(--border2);padding:9px 0;}
.info-row:last-child{border-bottom:none;}
.info-lbl{font-size:11px;color:var(--ink3);font-weight:500;width:160px;flex-shrink:0;}
.info-val{font-size:13px;color:var(--ink);flex:1;}

/* ── PROGRESS BAR ── */
.pb{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;}
.pf{height:100%;border-radius:2px;}

/* ── ACTION BTNS ── */
.ab{display:flex;gap:4px;}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;border:none;cursor:pointer;font-size:12px;transition:all .12s;}
.ib-g{background:var(--gold-bg);color:var(--gold);}
.ib-g:hover{background:var(--gold);color:#fff;}
.ib-t{background:var(--teal-bg);color:var(--teal);}
.ib-t:hover{background:var(--teal);color:#fff;}
.ib-r{background:var(--rose-bg);color:var(--rose);}
.ib-r:hover{background:var(--rose);color:#fff;}
.ib-n{background:var(--bg);color:var(--ink3);}
.ib-n:hover{background:var(--ink3);color:#fff;}

/* ── AGENDA ── */
.slot{display:flex;gap:12px;padding:10px 12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--card);margin-bottom:8px;}
.slot-h{font-size:15px;font-weight:600;color:var(--gold);line-height:1.1;min-width:44px;text-align:center;}
.slot-m{font-size:10px;color:var(--ink3);}
.slot-bar{width:3px;border-radius:2px;flex-shrink:0;}
.slot-body .slot-title{font-size:13px;font-weight:500;}
.slot-body .slot-sub{font-size:11.5px;color:var(--ink3);margin-top:2px;}

/* ── QUICK ACTIONS ── */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.qa{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .14s;text-align:center;}
.qa:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 14px rgba(181,145,58,.1);}
.qa-ico{font-size:22px;margin-bottom:7px;}
.qa-lbl{font-size:12px;font-weight:500;}

/* ── DOC CARD ── */
.doc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:13px 15px;cursor:pointer;transition:all .14s;}
.doc-card:hover{border-color:var(--gold);}

/* ── RESTRICOES ── */
.rest-lista{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r2);padding:5px;}
.rest-item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:12.5px;}
.rest-item:hover{background:var(--bg);}
.rest-cod{font-family:monospace;font-size:11px;color:var(--gold);min-width:42px;}
.rest-sel{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.rest-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;background:var(--gold-bg);border:1px solid var(--gold-b);border-radius:20px;font-size:11.5px;color:var(--gold);}

/* ── PRINT ── */
@media print{
  .sb,.topbar,.ph-acts,.ab,.btn,.md-foot{display:none!important;}
  .main{margin-left:0;}
  .content{padding:0;}
  .card{box-shadow:none;border:1px solid #ccc;}
  body{background:#fff;}
}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;padding:11px 16px;border-radius:var(--r2);font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(26,25,22,.15);transform:translateY(60px);opacity:0;transition:all .25s;z-index:999;pointer-events:none;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.ok{background:var(--sage);color:#fff;}
#toast.info{background:var(--teal);color:#fff;}
#toast.warn{background:var(--gold);color:#fff;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:rgba(26,25,22,.12);border-radius:2px;}

/* ── extra (2026-11) ── */
.nav-i.off{opacity:.45;cursor:default}
.nav-i.off:hover{background:none;color:rgba(255,255,255,.45)}
.soon{margin-left:auto;font-size:9px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:0 6px}
.burger{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink)}
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dchip{flex:0 0 58px;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:6px 2px;text-align:center;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--ink)}
.dchip small{display:block;font-size:10px;color:var(--ink3)}.dchip b{display:block;font-size:17px;font-weight:600}
.dchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.dchip.on small{color:rgba(255,255,255,.6)}
.dchip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.hchip{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:9px 0;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink)}
.hchip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.hchip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:7px 12px;font-family:'Outfit',sans-serif;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.dia-h{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px}
.dia-h.hoje{color:var(--gold)}
.slot{align-items:center}
.slot-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.espera{text-align:center;padding:10px 0}
.big{font-size:42px;font-weight:600;margin:10px 0}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--ink)}
.login{background:var(--card);border-radius:14px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login .logo-name{color:var(--ink);font-size:22px}
.err{color:var(--rose);font-size:13px;font-weight:500}
.muted{color:var(--ink3);font-size:12.5px}
.link{background:none;border:none;color:var(--teal);cursor:pointer;font-family:'Outfit',sans-serif;font-size:12.5px;padding:0;text-decoration:underline}
@media (max-width:860px){
  .sb{transform:translateX(-100%);transition:transform .2s}
  .sb.open{transform:none}
  .main{margin-left:0}
  .burger{display:block}
  .g4{grid-template-columns:1fr 1fr}.g2,.fgrid{grid-template-columns:1fr}
  .content{padding:16px 12px}
  .slot{flex-wrap:wrap}.slot-acts{width:100%;justify-content:flex-start}
}
</style>
</head>

    if (!S.cods) { carregarCods(); return h + '<p class="muted">A carregar…</p>'; }
    var n = { livre: 0, entregue: 0, usado: 0 };
    S.cods.forEach(function (c) { if (c.estado === 'usado' || c.estado === 'reservado') n.usado++; else if (c.estado === 'livre' && c.entregue_em) n.entregue++; else if (c.estado === 'livre') n.livre++; });
    h += '<div class="g3" style="margin-bottom:16px"><div class="stat sage"><div class="stat-v">' + n.livre + '</div><div class="stat-l">Por entregar</div></div><div class="stat gold"><div class="stat-v">' + n.entregue + '</div><div class="stat-l">Entregues, por usar</div></div><div class="stat teal"><div class="stat-v">' + n.usado + '</div><div class="stat-l">Usados</div></div></div>';
    h += '<div style="margin-bottom:12px"><div class="seg">' + [['livre', 'Por entregar'], ['entregue', 'Entregues'], ['usado', 'Usados']].map(function (o) { return '<button data-codf="' + o[0] + '" class="' + (S.codFiltro === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
    var lista = S.cods.filter(function (c) { var used = c.estado === 'usado' || c.estado === 'reservado'; return S.codFiltro === 'usado' ? used : S.codFiltro === 'entregue' ? (!used && c.estado === 'livre' && c.entregue_em) : (c.estado === 'livre' && !c.entregue_em); });
    if (S.codFiltro === 'livre') lista = lista.slice(0, 30);
    h += '<div class="card"><div class="tw"><table><thead><tr><th>Código</th><th>Formando</th><th>Turma</th><th>' + (S.codFiltro === 'usado' ? 'Usado em' : 'Entregue em') + '</th><th></th></tr></thead><tbody>';
    if (!lista.length) h += '<tr><td colspan="5" class="muted">Nada nesta lista.</td></tr>';
    lista.forEach(function (c) {
      h += '<tr><td style="font-family:monospace;font-size:13px;color:var(--ink)">' + esc(c.codigo) + '</td><td>' + esc(c.nome || '—') + '</td><td>' + esc(c.turma || '—') + '</td><td>' + (S.codFiltro === 'usado' ? (c.usado_em ? new Date(c.usado_em).toLocaleDateString('pt-PT') : '—') : (c.entregue_em ? new Date(c.entregue_em + 'T12:00:00').toLocaleDateString('pt-PT') : '—')) + '</td><td style="text-align:right">' + (S.codFiltro === 'livre' ? '<button class="btn btn-gold btn-xs" data-entregar="' + c.id + '">Entregar</button>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div>' + (S.codFiltro === 'livre' ? '<p class="muted" style="margin-top:10px">A mostrar os primeiros 30 códigos por entregar.</p>' : '') + '</div>';
    return h;
  }

  // ───────────── modal
  function modal(html) { document.getElementById('md').innerHTML = html; document.getElementById('mo').classList.add('open'); }
  function fecharModal() { document.getElementById('mo').classList.remove('open'); }
  document.getElementById('mo').addEventListener('click', function (e) { if (e.target.id === 'mo' || e.target.closest('[data-fechar]')) fecharModal(); });

  function verMarcacao(id) {
    var m = S.marc.find(function (x) { return x.id === id; }); if (!m) return;
    var linhas = [['Quando', dl(m.data) + ' às ' + hhmm(m.hora)], ['Estado', chipEstado(m)], ['Telemóvel', '<a href="tel:+351' + esc(m.telemovel) + '">' + esc(m.telemovel) + '</a> · <a target="_blank" rel="noopener" href="https://wa.me/351' + esc(m.telemovel) + '">WhatsApp</a>'], ['Email', esc(m.email || '—')], ['NIF', esc(m.nif || '— (consumidor final)')], ['Avaliação', (m.tipo === 'renovacao' ? 'Renovação' : 'Obtenção') + ' · ' + LNG[m.lingua] + (m.formando ? ' · formando' : '')], ['Valor', Number(m.valor) + ' € (MB WAY)'], ['Referência', esc(m.order_id || '')], ['Fatura', esc(m.fatura_estado === 'rascunho' ? 'Rascunho na série WEB do TOConline' : m.fatura_estado === 'emitida' ? 'Emitida' : m.fatura_estado === 'erro' ? 'Erro ao criar — ver TOConline' : '—')], ['Notas', esc(m.obs || '—')]];
    modal('<div class="md-hd"><div><h2>' + esc(m.nome) + '</h2></div><button class="md-x" data-fechar>✕</button></div><div class="md-body">' + linhas.map(function (l) { return '<div class="info-row"><div class="info-lbl">' + l[0] + '</div><div class="info-val">' + l[1] + '</div></div>'; }).join('') + '</div>');
  }
  function pedirCancelar(id) {
    var m = S.marc.find(function (x) { return x.id === id; }); if (!m) return;
    modal('<div class="md-hd"><div><h2>Cancelar marcação</h2><p>' + esc(m.nome) + ' · ' + esc(dl(m.data)) + ' às ' + hhmm(m.hora) + '</p></div><button class="md-x" data-fechar>✕</button></div><div class="md-body"><div class="alert aw">A vaga volta a ficar livre e o evento sai do Google Calendar. O cliente pagou ' + Number(m.valor) + ' €: se for para devolver, trate da devolução e da nota de crédito no TOConline.</div><div class="fg"><label>Motivo (interno)</label><input id="c-motivo" placeholder="ex.: pediu para remarcar"></div></div><div class="md-foot"><button class="btn btn-out" data-fechar>Voltar</button><button class="btn btn-rose" data-confcancel="' + id + '">Cancelar marcação</button></div>');
  }
  function entregarCodigo(id) {
    var c = S.cods.find(function (x) { return x.id === id; }); if (!c) return;
    modal('<div class="md-hd"><div><h2>Entregar código ' + esc(c.codigo) + '</h2><p>Registe a quem foi entregue. O formando usa-o na marcação do site.</p></div><button class="md-x" data-fechar>✕</button></div><div class="md-body"><div class="fgrid"><div class="fg full"><label>Nome do formando</label><input id="e-nome"></div><div class="fg"><label>Turma</label><input id="e-turma" placeholder="ex.: TVDE dez/2026"></div></div></div><div class="md-foot"><button class="btn btn-out" data-fechar>Voltar</button><button class="btn btn-gold" data-confentregar="' + id + '">Guardar</button></div>');
  }

  // ───────────── ações
  function guardarCampos() { ['f-nome', 'f-tel', 'f-email', 'f-nif', 'f-codigo'].forEach(function (k) { var e = document.getElementById(k); if (e) S.campos[k] = e.value; }); }
  function enviar(dados) {
    S.envio = true; S.msg = ''; render();
    fn('marcar', dados).then(function (j) {
      S.envio = false;
      if (j._s === 401) { sair(); return; }
      if (!j.id) { S.msg = j.erro || 'Não foi possível enviar.'; if (j._s === 409) { S.f.hora = ''; carregarAgenda(); } render(); return; }
      S.espera = { id: j.id, nome: dados.nome, tel: dados.telemovel, data: dados.data, hora: dados.hora, valor: j.valor, email: dados.email, dados: dados, fim: Date.now() + 240000, estado: 'pendente' };
      render(); poll();
    }).catch(function () { S.envio = false; S.msg = 'Sem ligação. Tente de novo.'; render(); });
  }
  function poll() {
    clearTimeout(S.timer);
    if (!S.espera || S.espera.estado !== 'pendente') return;
    fn('estado', { id: S.espera.id }).then(function (j) {
      if (!S.espera) return;
      if (j.estado && j.estado !== 'pendente') { S.espera.estado = j.estado; if (j.estado === 'pago') { S.campos = {}; S.f.hora = ''; carregarAgenda(); } render(); return; }
      S.timer = setTimeout(poll, 4000);
    }).catch(function () { S.timer = setTimeout(poll, 6000); });
  }
  setInterval(function () { var c = document.getElementById('contador'); if (c && S.espera) { var r = Math.max(0, Math.round((S.espera.fim - Date.now()) / 1000)); c.textContent = Math.floor(r / 60) + ':' + ('0' + r % 60).slice(-2); } }, 1000);

  root.addEventListener('change', function (e) { if (e.target.id === 'f-formando') { guardarCampos(); S.f.formando = e.target.checked; render(); } });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-pag],[data-tab],[data-filtro],[data-ir],[data-ftipo],[data-flingua],[data-fdia],[data-fhora],[data-mudar],[data-cancelar],[data-confcancel],[data-ver],[data-desbloq],[data-codf],[data-entregar],[data-confentregar],#enviar,#nova,#reenviar,#editar,#sair,#mudarpass,#burger,#atualizar,#b-add');
    if (!t) return;
    var d = t.dataset;
    if (d.pag) { S.pag = d.pag; document.getElementById('sb') && document.getElementById('sb').classList.remove('open'); render(); }
    else if (d.tab) { if (d.tab !== 'marcar' && S.tab === 'marcar') guardarCampos(); S.tab = d.tab; render(); }
    else if (d.filtro) { S.filtro = d.filtro; render(); }
    else if (d.ir) { S.pag = 'psi'; S.tab = d.ir; render(); }
    else if (d.ftipo) { guardarCampos(); S.f.tipo = d.ftipo; render(); }
    else if (d.flingua) { guardarCampos(); S.f.lingua = d.flingua; if (d.flingua !== 'pt') S.f.formando = false; render(); }
    else if (d.fdia) { guardarCampos(); S.f.dia = +d.fdia; S.f.hora = ''; S.msg = ''; render(); }
    else if (d.fhora) { guardarCampos(); S.f.hora = d.fhora; S.msg = ''; render(); }
    else if (d.ver) verMarcacao(d.ver);
    else if (d.cancelar) pedirCancelar(d.cancelar);
    else if (d.mudar || d.confcancel) {
      var id = d.id || d.confcancel, novo = d.mudar || 'cancelado', motivo = (document.getElementById('c-motivo') || {}).value || '';
      t.disabled = true;
      fn('mudar', { id: id, estado: novo, motivo: motivo }).then(function (j) {
        fecharModal();
        if (!j.ok) { toast(j.erro || 'Não foi possível alterar.', 'warn'); return; }
        toast(novo === 'cancelado' ? (j.google ? 'Cancelada e retirada do Google Calendar.' : 'Cancelada. Retire o evento do Google Calendar à mão.') : novo === 'pago' ? 'Alteração desfeita.' : 'Marcado como ' + novo + '.', j.google === false ? 'warn' : 'ok');
        carregarAgenda();
      });
    }
    else if (d.desbloq) { sb.from('psi_bloqueios').delete().eq('id', d.desbloq).then(function (r) { if (r.error) toast('Não foi possível retirar.', 'warn'); else { toast('Bloqueio retirado.'); carregarBloq(); carregarAgenda(); } }); }
    else if (d.codf) { S.codFiltro = d.codf; render(); }
    else if (d.entregar) entregarCodigo(d.entregar);
    else if (d.confentregar) {
      var nome = document.getElementById('e-nome').value.trim(); if (nome.length < 3) { toast('Escreva o nome do formando.', 'warn'); return; }
      sb.from('codigos_formando').update({ nome: nome, turma: document.getElementById('e-turma').value.trim() || null, entregue_em: S.hoje }).eq('id', d.confentregar).then(function (r) { fecharModal(); if (r.error) toast('Não foi possível guardar.', 'warn'); else { toast('Código registado.'); carregarCods(); } });
    }
    else if (t.id === 'b-add') {
      var bd = document.getElementById('b-data').value, bh = document.getElementById('b-hora').value, bm = document.getElementById('b-motivo').value.trim();
      if (!bd) { toast('Escolha o dia.', 'warn'); return; }
      sb.from('psi_bloqueios').insert({ data: bd, hora: bh || null, motivo: bm || null }).then(function (r) { if (r.error) toast('Não foi possível bloquear.', 'warn'); else { toast('Bloqueado.'); carregarBloq(); carregarAgenda(); } });
    }
    else if (t.id === 'enviar') {
      guardarCampos();
      var c = S.campos, nome2 = (c['f-nome'] || '').trim(), tel = (c['f-tel'] || '').replace(/\D/g, '').replace(/^351(?=9\d{8}$)/, '');
      if (nome2.length < 3) { S.msg = 'Escreva o nome completo do cliente.'; render(); return; }
      if (!/^9\d{8}$/.test(tel)) { S.msg = 'O telemóvel tem de ter 9 dígitos e começar por 9.'; render(); return; }
      enviar({ data: S.dias[S.f.dia].data, hora: S.f.hora, tipo: S.f.tipo, lingua: S.f.lingua, formando: S.f.formando, codigo: (c['f-codigo'] || '').trim(), nome: nome2, telemovel: tel, email: (c['f-email'] || '').trim(), nif: (c['f-nif'] || '').replace(/\D/g, '') });
    }
    else if (t.id === 'nova') { S.espera = null; render(); }
    else if (t.id === 'reenviar') { var dd = S.espera.dados; S.espera = null; enviar(dd); }
    else if (t.id === 'editar') { var de = S.espera.dados; S.campos = { 'f-nome': de.nome, 'f-tel': de.telemovel, 'f-email': de.email, 'f-nif': de.nif, 'f-codigo': de.codigo }; S.espera = null; S.f.hora = ''; render(); carregarAgenda(); }
    else if (t.id === 'sair') sair();
    else if (t.id === 'mudarpass') ecraLogin('nova');
    else if (t.id === 'burger') document.getElementById('sb').classList.toggle('open');
    else if (t.id === 'atualizar') { carregarAgenda(); toast('Atualizado.', 'info'); }
  });
  setInterval(function () { if (S.eu && S.pag !== 'psi' || (S.eu && S.tab === 'agenda')) carregarAgenda(); }, 60000);

  sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { tipoLink = 'recovery'; ecraLogin('nova'); } });
  sb.auth.getSession().then(function (r) { entrar(r.data.session); });
})();
</script>
