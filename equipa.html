<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Equipa · Marcar psicotécnico · Instituto 31</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--accent:#0670C2;--ground:#F4F6F8;--line:#C9CED4;--input:#A3AAB2;--muted:#555B63;--ok:#1E7B3A;--okbg:#E7F6EC;--danger:#B42318;--warnbg:#FFF6E0;--warn:#6B4E00}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;font-size:16px;line-height:1.4}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-weight:800;letter-spacing:-.02em;font-size:18px}
header button{background:none;border:1px solid #555;color:#ddd;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:18px 14px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h1{font-size:26px}h2{font-size:20px}
.t{margin:0 0 8px;font-weight:700;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{font:inherit;cursor:pointer;border-radius:12px;min-height:46px;padding:6px 12px;font-weight:700;background:#fff;color:var(--ink);border:1px solid var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:disabled{background:var(--ground);color:var(--muted);border:1px dashed var(--line);text-decoration:line-through;cursor:not-allowed}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dias .chip{flex:0 0 64px;padding:6px 4px}
.dias small{display:block;font-size:12px;font-weight:500}.dias strong{display:block;font-size:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
label.f span{font-weight:400;font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=password]{font:inherit;font-weight:400;padding:11px 12px;border:1px solid var(--input);border-radius:10px;width:100%}
.ck{display:flex;gap:10px;align-items:center;font-size:15px}.ck input{width:20px;height:20px;margin:0}
.btn{font:inherit;min-height:54px;border:0;border-radius:999px;font-weight:800;font-size:17px;color:#fff;width:100%;cursor:pointer;background:var(--accent)}
.btn:disabled{background:var(--line);cursor:not-allowed}
.btn2{font:inherit;min-height:48px;border-radius:999px;font-weight:700;font-size:15px;width:100%;cursor:pointer;background:#fff;color:var(--ink);border:2px solid var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btnwa{background:#1E8E4E;border-color:#1E8E4E;color:#fff}
.err{margin:0;color:var(--danger);font-weight:600;font-size:14px}
.muted{color:var(--muted);font-size:14px;margin:0}
.estado{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.big{font-weight:800;font-size:40px;padding:4px 22px;border-radius:14px;background:var(--ground)}
.selo{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
.lista{display:flex;flex-direction:column;gap:0}
.lista .dia{font-weight:800;margin:12px 0 4px;font-size:15px}
.lista .m{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #E3E6EA;font-size:15px}
.lista .m a{color:var(--ink)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.pago{background:var(--okbg);color:var(--ok)}.tag.pendente{background:var(--warnbg);color:var(--warn)}
.passos{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header><b>Instituto 31 · Equipa</b><button type="button" id="sair" hidden>Sair</button></header>
<main id="app"><div class="card"><p class="muted">A carregar…</p></div></main>
<script>
(function () {
  var API = 'https://dzccpluaszhcroehktrg.supabase.co/functions/v1';
  var DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'], MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var DIASL = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var app = document.getElementById('app'), sairBtn = document.getElementById('sair');
  var chave = ''; try { chave = localStorage.getItem('i31_equipa') || ''; } catch (e) {}
  var S = { ecra: chave ? 'form' : 'login', dias: null, marc: [], dia: -1, hora: '', tipo: 'obtencao', lingua: 'pt', formando: false, msg: '', envio: false, id: null, fim: 0, timer: null, ult: null, f: {} };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function preco() { return S.lingua !== 'pt' ? 70 : (S.formando ? 25 : 35); }
  function dLonga(iso) { var d = new Date(iso + 'T12:00:00'); return DIASL[d.getDay()] + ', ' + d.getDate() + ' ' + MESES[d.getMonth()]; }
  function api(acao, extra) {
    var b = Object.assign({ acao: acao, chave: chave }, extra || {});
    return fetch(API + '/psi-equipa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) })
      .then(function (r) { return r.json().then(function (j) { j._s = r.status; return j; }); });
  }
  function guardarCampos() { ['f-nome', 'f-tel', 'f-email', 'f-nif', 'f-codigo'].forEach(function (k) { var e = document.getElementById(k); if (e) S.f[k] = e.value; }); }
  function val(k) { return esc(S.f[k] || ''); }

  function carregar() {
    api('agenda').then(function (j) {
      if (j._s === 401) { sair(); return; }
      S.dias = j.dias || []; S.marc = j.marcacoes || [];
      if (S.dia >= 0 && S.dias[S.dia] && S.hora && S.dias[S.dia].livres.indexOf(S.hora) < 0) S.hora = '';
      if (S.dia < 0) for (var i = 0; i < S.dias.length; i++) if (S.dias[i].livres.length) { S.dia = i; break; }
      render();
    }).catch(function () { S.msg = 'Sem ligação. Tente de novo.'; S.dias = []; render(); });
  }
  function sair() { try { localStorage.removeItem('i31_equipa'); } catch (e) {} chave = ''; S.ecra = 'login'; S.msg = ''; render(); }

  function render() {
    sairBtn.hidden = S.ecra === 'login';
    var h = '';
    if (S.ecra === 'login') {
      h += '<form class="card" id="login"><h1>Entrar</h1><p class="muted">Página interna para marcar psicotécnicos pedidos por WhatsApp ou telefone.</p>';
      h += '<label class="f">Palavra-passe da equipa<input id="l-chave" type="password" autocomplete="current-password" required></label>';
      if (S.msg) h += '<p class="err" role="alert">' + esc(S.msg) + '</p>';
      h += '<button class="btn" type="submit">Entrar</button></form>';
    } else if (S.ecra === 'form') {
      h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h1>Marcar psicotécnico</h1><span style="font-weight:800;font-size:24px">' + preco() + ' €</span></div>';
      h += '<p class="muted">Escolha a vaga, escreva os dados do cliente e carregue em enviar. O cliente recebe o pedido de pagamento na app MB WAY e só tem de aprovar.</p>';
      h += '<div><p class="t">Tipo</p><div class="grid2">' + [['obtencao', 'Obtenção · 1h30'], ['renovacao', 'Renovação · 50 min']].map(function (o) { return '<button type="button" class="chip" data-tipo="' + o[0] + '" aria-pressed="' + (S.tipo === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
      h += '<div><p class="t">Língua</p><div class="row">' + [['pt', 'Português · 35 €'], ['en', 'Inglês · 70 €'], ['fr', 'Francês · 70 €']].map(function (o) { return '<button type="button" class="chip" data-lingua="' + o[0] + '" aria-pressed="' + (S.lingua === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
      if (S.lingua === 'pt') {
        h += '<label class="ck"><input type="checkbox" id="f-formando"' + (S.formando ? ' checked' : '') + '>Formando do Instituto 31 (25 €)</label>';
        if (S.formando) h += '<label class="f">Código de formando <span>Opcional. Se o cliente tiver o código, escreva-o para o dar como usado.</span><input id="f-codigo" type="text" maxlength="13" placeholder="I31-XXXX-XXXX" style="text-transform:uppercase" value="' + val('f-codigo') + '"></label>';
      }
      h += '<div><p class="t">Dia</p>';
      if (!S.dias) h += '<p class="muted">A carregar a agenda…</p>';
      else if (!S.dias.length) h += '<p class="muted">Sem dias disponíveis.</p>';
      else {
        h += '<div class="dias">' + S.dias.map(function (d, i) { var dt = new Date(d.data + 'T12:00:00'), off = !d.livres.length; return '<button type="button" class="chip" data-dia="' + i + '"' + (off ? ' disabled' : '') + ' aria-pressed="' + (S.dia === i) + '"><small>' + DIAS[dt.getDay()] + '</small><strong>' + dt.getDate() + '</strong><small>' + MESES[dt.getMonth()] + '</small></button>'; }).join('') + '</div>';
      }
      h += '</div>';
      if (S.dias && S.dia >= 0 && S.dias[S.dia]) {
        var d = S.dias[S.dia];
        h += '<div><p class="t">Hora · ' + esc(dLonga(d.data)) + '</p><div class="grid3">' + d.horas.map(function (hr) { var off = d.livres.indexOf(hr) < 0; return '<button type="button" class="chip" data-hora="' + hr + '"' + (off ? ' disabled' : '') + ' aria-pressed="' + (S.hora === hr) + '">' + hr + '</button>'; }).join('') + '</div></div>';
      }
      h += '<label class="f">Nome completo do cliente<input id="f-nome" type="text" autocomplete="off" value="' + val('f-nome') + '"></label>';
      h += '<label class="f">Telemóvel com MB WAY <span>É para este número que vai o pedido de pagamento.</span><input id="f-tel" type="tel" inputmode="tel" placeholder="9xx xxx xxx" value="' + val('f-tel') + '"></label>';
      h += '<div class="grid2"><label class="f">Email <span>Opcional · para a confirmação</span><input id="f-email" type="email" autocomplete="off" value="' + val('f-email') + '"></label>';
      h += '<label class="f">NIF <span>Opcional · em branco = consumidor final</span><input id="f-nif" type="text" inputmode="numeric" maxlength="9" value="' + val('f-nif') + '"></label></div>';
      if (S.msg) h += '<p class="err" role="alert">' + esc(S.msg) + '</p>';
      var can = !!S.hora && !S.envio;
      h += '<button type="button" class="btn" id="enviar"' + (can ? '' : ' disabled') + '>' + (S.envio ? 'A enviar…' : S.hora ? 'Enviar pedido MB WAY · ' + preco() + ' €' : 'Escolha o dia e a hora') + '</button>';
      h += '</div>';
      h += lista();
    } else if (S.ecra === 'espera') {
      var u = S.ult, rest = Math.max(0, Math.round((S.fim - Date.now()) / 1000));
      var txt = 'Olá ' + u.nome.split(' ')[0] + '! Já está reservado para ' + dLonga(u.data) + ' às ' + u.hora + '. Acabámos de lhe enviar um pedido MB WAY de ' + u.valor + ' €: abra a app MB WAY e aprove para confirmar. Instituto 31';
      h += '<div class="card estado"><span class="selo" style="background:var(--warnbg);color:var(--warn)">À espera do cliente</span><h2>Pedido MB WAY enviado</h2>';
      h += '<p class="muted">' + esc(u.nome) + ' · ' + esc(u.tel) + '<br>' + esc(dLonga(u.data)) + ' às ' + esc(u.hora) + ' · ' + u.valor + ' €</p>';
      h += '<p class="big" aria-live="polite">' + Math.floor(rest / 60) + ':' + ('0' + rest % 60).slice(-2) + '</p>';
      h += '<p class="muted">O cliente tem uns 4 minutos para aprovar na app MB WAY. Esta página atualiza sozinha.</p>';
      h += '<a class="btn2 btnwa" target="_blank" rel="noopener" href="https://wa.me/351' + encodeURIComponent(u.tel) + '?text=' + encodeURIComponent(txt) + '">Avisar o cliente no WhatsApp</a>';
      h += '</div>';
    } else if (S.ecra === 'pago') {
      var p = S.ult;
      h += '<div class="card estado"><span class="selo" style="background:var(--okbg);color:var(--ok)">✓ Pago</span><h2>Marcação confirmada</h2>';
      h += '<p class="muted">' + esc(p.nome) + '<br>' + esc(dLonga(p.data)) + ' às ' + esc(p.hora) + ' · ' + p.valor + ' €</p>';
      h += '<p class="muted">Já está no Google Calendar, a fatura ficou em rascunho no TOConline' + (p.email ? ' e o cliente recebeu a confirmação por email' : '') + '.</p>';
      h += '<button type="button" class="btn" id="nova">Nova marcação</button></div>';
      h += lista();
    } else if (S.ecra === 'falhou') {
      var q = S.ult;
      h += '<div class="card estado"><span class="selo" style="background:#FDECEA;color:var(--danger)">' + (S.motivo === 'recusado' ? 'Recusado' : 'Expirou') + '</span><h2>O pagamento não foi aprovado</h2>';
      h += '<p class="muted">' + (S.motivo === 'recusado' ? 'O cliente recusou o pedido ou o MB WAY rejeitou-o.' : 'O cliente não aprovou a tempo.') + ' A vaga voltou a ficar livre.</p>';
      h += '<button type="button" class="btn" id="reenviar">Enviar de novo para ' + esc(q.tel) + '</button>';
      h += '<button type="button" class="btn2" id="editar">Alterar dados ou hora</button></div>';
    }
    app.innerHTML = h;
  }

  function lista() {
    if (!S.marc.length) return '<div class="card"><h2>Próximas marcações</h2><p class="muted">Ainda não há marcações nos próximos dias.</p></div>';
    var h = '<div class="card"><h2>Próximas marcações</h2><div class="lista">', ult = '';
    S.marc.forEach(function (m) {
      if (m.data !== ult) { ult = m.data; h += '<p class="dia">' + esc(dLonga(m.data)) + '</p>'; }
      h += '<div class="m"><b>' + esc(String(m.hora).slice(0, 5)) + '</b><span>' + esc(m.nome) + '<br><a href="tel:+351' + esc(m.telemovel) + '" class="muted">' + esc(m.telemovel) + '</a>' + (m.tipo === 'renovacao' ? ' · renovação' : '') + (m.lingua !== 'pt' ? ' · ' + esc(m.lingua.toUpperCase()) : '') + '</span><span class="tag ' + esc(m.estado) + '">' + (m.estado === 'pago' ? 'Pago' : 'A aguardar') + '</span></div>';
    });
    return h + '</div></div>';
  }

  function enviar(dados) {
    S.envio = true; S.msg = ''; render();
    api('marcar', dados).then(function (j) {
      S.envio = false;
      if (j._s === 401) { sair(); return; }
      if (!j.id) { S.ecra = 'form'; S.msg = j.erro || 'Não foi possível enviar.'; if (j._s === 409) { S.hora = ''; carregar(); } render(); return; }
      S.id = j.id; S.ult = { nome: dados.nome, tel: dados.telemovel.replace(/\D/g, '').replace(/^351/, ''), data: dados.data, hora: dados.hora, valor: j.valor, email: dados.email, dados: dados };
      S.fim = Date.now() + 4 * 60 * 1000; S.ecra = 'espera'; render(); poll();
    }).catch(function () { S.envio = false; S.msg = 'Sem ligação. Tente de novo.'; render(); });
  }
  function poll() {
    clearTimeout(S.timer);
    if (S.ecra !== 'espera') return;
    render();
    fetch(API + '/psi-estado?id=' + encodeURIComponent(S.id)).then(function (r) { return r.json(); }).then(function (j) {
      if (j.estado === 'pago') { S.ecra = 'pago'; S.f = {}; S.hora = ''; render(); carregar(); return; }
      if (j.estado === 'expirado' || j.estado === 'recusado') { S.ecra = 'falhou'; S.motivo = j.estado; render(); return; }
      S.timer = setTimeout(poll, 4000);
    }).catch(function () { S.timer = setTimeout(poll, 6000); });
  }

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var k = document.getElementById('l-chave').value.trim();
    chave = k;
    api('entrar').then(function (j) {
      if (!j.ok) { S.msg = j.erro || 'Palavra-passe errada.'; chave = ''; render(); return; }
      try { localStorage.setItem('i31_equipa', k); } catch (er) {}
      S.ecra = 'form'; S.msg = ''; render(); carregar();
    }).catch(function () { S.msg = 'Sem ligação.'; render(); });
  });
  app.addEventListener('change', function (e) { if (e.target.id === 'f-formando') { guardarCampos(); S.formando = e.target.checked; render(); } });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tipo) { guardarCampos(); S.tipo = b.dataset.tipo; render(); }
    else if (b.dataset.lingua) { guardarCampos(); S.lingua = b.dataset.lingua; if (S.lingua !== 'pt') S.formando = false; render(); }
    else if (b.dataset.dia) { guardarCampos(); S.dia = +b.dataset.dia; S.hora = ''; S.msg = ''; render(); }
    else if (b.dataset.hora) { guardarCampos(); S.hora = b.dataset.hora; S.msg = ''; render(); }
    else if (b.id === 'enviar') {
      guardarCampos();
      var nome = (S.f['f-nome'] || '').trim(), tel = (S.f['f-tel'] || '').replace(/\D/g, '').replace(/^351(?=9\d{8}$)/, '');
      if (nome.length < 3) { S.msg = 'Escreva o nome completo do cliente.'; render(); return; }
      if (!/^9\d{8}$/.test(tel)) { S.msg = 'O telemóvel tem de ter 9 dígitos e começar por 9.'; render(); return; }
      enviar({ data: S.dias[S.dia].data, hora: S.hora, tipo: S.tipo, lingua: S.lingua, formando: S.formando, codigo: (S.f['f-codigo'] || '').trim(), nome: nome, telemovel: tel, email: (S.f['f-email'] || '').trim(), nif: (S.f['f-nif'] || '').replace(/\D/g, '') });
    }
    else if (b.id === 'nova') { S.ecra = 'form'; S.msg = ''; render(); }
    else if (b.id === 'reenviar') {
      var d0 = S.ult.dados, di = -1;
      enviar(d0);
    }
    else if (b.id === 'editar') { var dd = S.ult.dados; S.f = { 'f-nome': dd.nome, 'f-tel': dd.telemovel, 'f-email': dd.email, 'f-nif': dd.nif, 'f-codigo': dd.codigo }; S.ecra = 'form'; S.hora = ''; render(); carregar(); }
  });
  sairBtn.addEventListener('click', sair);
  setInterval(function () { if (S.ecra === 'espera') render(); }, 1000);
  render(); if (chave) carregar();
})();
</script>
</body>
</html>
